[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "boatrace-34j"
version = "0.0.0"
description = "BOAT RACE prediction"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cyclopts",
]
urls."Bug Tracker" = "https://github.com/34j/boatrace-34j/issues"
urls.Changelog = "https://github.com/34j/boatrace-34j/blob/main/CHANGELOG.md"
urls.documentation = "https://boatrace-34j.readthedocs.io"
urls.repository = "https://github.com/34j/boatrace-34j"
scripts.boatrace-34j = "boatrace_34j.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
